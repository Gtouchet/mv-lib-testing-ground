<div class="configuration">
    
    <app-configuration-section title="Styles">
        <app-input-color
            [value]="styles().backgroundColor"
            label="Background color"
            (onChange)="setStyle('backgroundColor', $event)"
        />
        <app-dimensions-inputs
            [width]="styles().dimensions?.width"
            [minWidth]="styles().dimensions?.minWidth"
            [maxWidth]="styles().dimensions?.maxWidth"
            [height]="styles().dimensions?.height"
            [minHeight]="styles().dimensions?.minHeight"
            [maxHeight]="styles().dimensions?.maxHeight"
            (onWidthChange)="setStyle('dimensions.width', $event)"
            (onMinWidthChange)="setStyle('dimensions.minWidth', $event)"
            (onMaxWidthChange)="setStyle('dimensions.maxWidth', $event)"
            (onHeightChange)="setStyle('dimensions.height', $event)"
            (onMinHeightChange)="setStyle('dimensions.minHeight', $event)"
            (onMaxHeightChange)="setStyle('dimensions.maxHeight', $event)"
        />
        <app-border-inputs
            [width]="styles().border?.width"
            [style]="styles().border?.style"
            [color]="styles().border?.color"
            [radius]="styles().border?.radius"
            (onWidthChange)="setStyle('border.width', $event)"
            (onStyleChange)="setStyle('border.style', $event)"
            (onColorChange)="setStyle('border.color', $event)"
            (onRadiusChange)="setStyle('border.radius', $event)"
        />
        <app-font-inputs
            [size]="styles().font?.size"
            [weight]="styles().font?.weight"
            [style]="styles().font?.style"
            [color]="styles().font?.color"
            (onSizeChange)="setStyle('font.size', $event)"
            (onWeightChange)="setStyle('font.weight', $event)"
            (onStyleChange)="setStyle('font.style', $event)"
            (onColorChange)="setStyle('font.color', $event)"
        />
    </app-configuration-section>

    <app-configuration-section title="Effects">
        <app-darken-hover-inputs
            [enabled]="effects().classes!.includes('mv-lib-darken-hover')"
            [percentage]="$any(effects().styles?.darkenHover?.percentage)"
            (onEnabledChange)="setEffect('mv-lib-darken-hover', $event)"
            (onPercentageChange)="setEffectStyle('darkenHover.percentage', $event)"
        />
        <app-outline-blur-selected-inputs
            [enabled]="effects().classes!.includes('mv-lib-outline-blur-selected')"
            [color]="$any(effects().styles?.outlineBlurSelected?.color)"
            [radius]="$any(effects().styles?.outlineBlurSelected?.radius)"
            (onEnabledChange)="setEffect('mv-lib-outline-blur-selected', $event)"
            (onColorChange)="setEffectStyle('outlineBlurSelected.color', $event)"
            (onRadiusChange)="setEffectStyle('outlineBlurSelected.radius', $event)"
        />
        <app-outline-solid-selected-inputs
            [enabled]="effects().classes!.includes('mv-lib-outline-solid-selected')"
            [color]="$any(effects().styles?.outlineSolidSelected?.color)"
            [width]="$any(effects().styles?.outlineSolidSelected?.width)"
            (onEnabledChange)="setEffect('mv-lib-outline-solid-selected', $event)"
            (onColorChange)="setEffectStyle('outlineSolidSelected.color', $event)"
            (onWidthChange)="setEffectStyle('outlineSolidSelected.width', $event)"
        />
    </app-configuration-section>

    <app-configuration-section title="Settings">
        <app-input-checkbox
            [checked]="form.get('input')?.disabled"
            label="Disabled"
            (onChange)="
                $event ? form.get('input')?.disable() : form.get('input')?.enable();
                refreshLog();
            "
        />
        <app-input-checkbox
            [checked]="selected()"
            label="Selected"
            (onChange)="
                selected.set($event);
                refreshLastInteractionTime();
                refreshLog();
            "
        />
    </app-configuration-section>

    <app-configuration-section title="Form controls">
        <div class="form-state">
            <span>{{ form.touched ? 'Touched' : 'Untouched' }}</span>
            <span>{{ form.dirty ? 'Dirty' : 'Pristine' }}</span>
            <span>{{ form.disabled ? 'Disabled' : (form.valid ? 'Valid' : 'Invalid') }}</span>
        </div>
        <app-input-checkbox
            [checked]="required()"
            label="Required"
            [style.color]="form.get('input')?.hasError('required') ? 'red' : 'black'"
            (onChange)="
                required.set($event);
                updateFormValidator(
                    'input',
                    'required',
                    required());
            "
        />
        <app-input-checkbox
            [checked]="onlyCharacters()"
            label="Only characters"
            [style.color]="form.get('input')?.hasError('pattern') ? 'red' : 'black'"
            (onChange)="
                onlyCharacters.set($event);
                updateFormValidator(
                    'input',
                    'pattern-only-characters',
                    onlyCharacters());
            "
        />
        <app-input-number
            [value]="minLength()"
            label="Min length"
            [style.color]="form.get('input')?.hasError('minlength') ? 'red' : 'black'"
            (onChange)="
                minLength.set($event);
                updateFormValidator(
                    'input',
                    'minLength',
                    minLength());
            "
        />
    </app-configuration-section>
</div>

<form
    [formGroup]="form"
    class="visual"
>
    <mv-lib-textbox-classic
        #mvLibComponent
        formControlName="input"
        class="component"
        [(styles)]="styles"
        [(settings)]="settings"
        [(effects)]="effects"
        [selected]="selected()"
        (onChange)="
            form.get('input')?.setValue($event.input);
            refreshLastInteractionTime();
            refreshLog();
        "
        (onSelect)="
            selected.set($event.selected);
            refreshLastInteractionTime();
            refreshLog();
        "
    />

<pre class="log">
Last interaction time: {{ lastInteractionTime() }}<br/>
input: {{ form.get('input')?.value }}<br/>
&lt;mv-lib-textbox-classic{{ log() }}/&gt;
</pre>
</form>
