<ng-template #stylesConfiguration let-type="type" let-configuration="configuration" let-localConfiguration="localConfiguration">
    <div class="inputs-group">
        Icon
        <app-input-text
            [value]="localConfiguration.icon"
            (onChange)="localConfiguration.icon = $event;"
        />
        Message
        <app-input-text
            [value]="localConfiguration.message"
            (onChange)="localConfiguration.message = $event;"
        />
        Text color
        <app-input-color
            [value]="configuration.styles.textColor"
            (onChange)="configuration.styles.textColor = $event"
        />
        Background color
        <app-input-color
            [value]="configuration.styles.backgroundColor"
            (onChange)="configuration.styles.backgroundColor = $event"
        />
        Forced width
        <app-input-text
            [value]="configuration.styles.forcedWidth"
            (onChange)="configuration.styles.forcedWidth = $event"
        />
        Forced height
        <app-input-text
            [value]="configuration.styles.forcedHeight"
            (onChange)="configuration.styles.forcedHeight = $event"
        />
        Opacity percentage
        <app-input-number
            [value]="configuration.styles.opacityPercentage"
            (onChange)="configuration.styles.opacityPercentage = $event"
        />
    </div>
</ng-template>

<ng-template #effectsConfiguration let-type="type" let-configuration="configuration">
    <app-outline-blur-hover-inputs
        [enabled]="configuration.effects.classes.includes(mvLibEffects.hover.outlineBlur.class)"
        [style]="configuration.effects.styles.outlineBlurHover"
        (onChangeEnabled)="toastService.setEffect(type, mvLibEffects.hover.outlineBlur.class, $event); refreshLog();"
        (onChangeStyle)="toastService.setEffectStyle(type, `outlineBlurHover.${$event.key}`, $event.value); refreshLog();"
    />
    <app-outline-solid-hover-inputs
        [enabled]="configuration.effects.classes.includes(mvLibEffects.hover.outlineSolid.class)"
        [style]="configuration.effects.styles.outlineSolidHover"
        (onChangeEnabled)="toastService.setEffect(type, mvLibEffects.hover.outlineSolid.class, $event); refreshLog();"
        (onChangeStyle)="toastService.setEffectStyle(type, `outlineSolidHover.${$event.key}`, $event.value); refreshLog();"
    />
    <app-fade-in-idle-inputs
        [enabled]="configuration.effects.classes.includes(mvLibEffects.idle.fadeIn.class)"
        [style]="configuration.effects.styles.fadeInIdle"
        (onChangeEnabled)="toastService.setEffect(type, mvLibEffects.idle.fadeIn.class, $event); refreshLog();"
        (onChangeStyle)="toastService.setEffectStyle(type, `fadeInIdle.${$event.key}`, $event.value); refreshLog();"
    />
    <app-fade-out-idle-inputs
        [enabled]="configuration.effects.classes.includes(mvLibEffects.idle.fadeOut.class)"
        [style]="configuration.effects.styles.fadeOutIdle"
        (onChangeEnabled)="toastService.setEffect(type, mvLibEffects.idle.fadeOut.class, $event); refreshLog();"
        (onChangeStyle)="toastService.setEffectStyle(type, `fadeOutIdle.${$event.key}`, $event.value); refreshLog();"
    />
    <app-progress-bar-darken-fill-inputs
        [enabled]="configuration.effects.classes.includes(mvLibEffects.idle.progressBarDarkenFill.class)"
        [style]="configuration.effects.styles.progressBarDarkenFill"
        (onChangeEnabled)="toastService.setEffect(type, mvLibEffects.idle.progressBarDarkenFill.class, $event); refreshLog();"
        (onChangeStyle)="toastService.setEffectStyle(type, `progressBarDarkenFill.${$event.key}`, $event.value); refreshLog();"
    />

</ng-template>

<ng-template #settingsConfiguration let-type="type" let-configuration="configuration">
    <app-inputs-separator [title]="type" />
    <app-input-text
        [value]="configuration.settings.lifespan"
        label="Lifespan"
        (onChange)="configuration.settings.lifespan = $event"
    />
</ng-template>

<ng-template #toastButton let-type="type" let-configuration="configuration" let-localConfiguration="localConfiguration">
    <mv-lib-button-classic
        [inputStyle]="{
            dimensions: {
                width: '100px',
                height: '40px',
            },
            backgroundColor: configuration.styles.backgroundColor,
        }"
        [inputEffects]="{
            classes: [
                mvLibEffects.idle.shadow.class,
                mvLibEffects.hover.tint.class,
                mvLibEffects.click.push.class,
            ],
            styles: {
                shadowIdle: {
                    color: configuration.styles.backgroundColor,
                }
            }
        }"
        (onClick)="
            refreshLastInteractionTime();
            $any(toastService)[type.toLowerCase()](
                localConfiguration.message,
                localConfiguration.icon,
                {
                    widthPx: configuration.styles.forcedWidth,
                    heightPx: configuration.styles.forcedHeight,
                }
            )
        "
    >
        <span [style.color]="configuration.styles.textColor">
            {{ type }}
        </span>
    </mv-lib-button-classic>
</ng-template>

<div class="configuration">
    <app-configuration-section [title]="'Styles for ' + selectedStyleConfiguration().type">
        <div buttons class="type-buttons">
            <app-input-button
                label="Success"
                [selected]="selectedStyleConfiguration().type === 'success'"
                (onClick)="selectStyle('success')"
            />
            <app-input-button
                label="Warning"
                [selected]="selectedStyleConfiguration().type === 'warning'"
                (onClick)="selectStyle('warning')"
            />
            <app-input-button
                label="Error"
                [selected]="selectedStyleConfiguration().type === 'error'"
                (onClick)="selectStyle('error')"
            />
            <app-input-button
                label="Info"
                [selected]="selectedStyleConfiguration().type === 'info'"
                (onClick)="selectStyle('info')"
            />
        </div>
        <ng-container *ngTemplateOutlet="stylesConfiguration; context: {
            type: selectedStyleConfiguration().type,
            configuration: selectedStyleConfiguration().configuration,
            localConfiguration: selectedStyleConfiguration().localConfiguration,
        }" />
    </app-configuration-section>
    
    <app-configuration-section [title]="'Effects for ' + selectedEffectConfiguration().type">
        <div buttons class="type-buttons">
            <app-input-button
                label="Success"
                [selected]="selectedEffectConfiguration().type === 'success'"
                (onClick)="selectEffect('success')"
            />
            <app-input-button
                label="Warning"
                [selected]="selectedEffectConfiguration().type === 'warning'"
                (onClick)="selectEffect('warning')"
            />
            <app-input-button
                label="Error"
                [selected]="selectedEffectConfiguration().type === 'error'"
                (onClick)="selectEffect('error')"
            />
            <app-input-button
                label="Info"
                [selected]="selectedEffectConfiguration().type === 'info'"
                (onClick)="selectEffect('info')"
            />
        </div>
        <ng-container *ngTemplateOutlet="effectsConfiguration; context: {
            type: selectedEffectConfiguration().type,
            configuration: selectedEffectConfiguration().configuration,
        }" />
    </app-configuration-section>

    <app-configuration-section [title]="'Settings for ' + selectedSettingsConfiguration().type">
        <div buttons class="type-buttons">
            <app-input-button
                label="Success"
                [selected]="selectedSettingsConfiguration().type === 'success'"
                (onClick)="selectSettings('success')"
            />
            <app-input-button
                label="Warning"
                [selected]="selectedSettingsConfiguration().type === 'warning'"
                (onClick)="selectSettings('warning')"
            />
            <app-input-button
                label="Error"
                [selected]="selectedSettingsConfiguration().type === 'error'"
                (onClick)="selectSettings('error')"
            />
            <app-input-button
                label="Info"
                [selected]="selectedSettingsConfiguration().type === 'info'"
                (onClick)="selectSettings('info')"
            />
        </div>
        <app-inputs-separator title="General" />
        Position
        <app-input-radio
            [values]="['top-left', 'top-right', 'bottom-left', 'bottom-right']"
            [selected]="toastService.configuration().position"
            (onChange)="toastService.configuration().position = $any($event)"
        />
        <app-input-checkbox
            [checked]="toastService.configuration().adaptWidth"
            label="Adapt width"
            (onChange)="toastService.setAdaptWidth($event)"
        />
        <ng-container *ngTemplateOutlet="settingsConfiguration; context: {
            type: selectedSettingsConfiguration().type,
            configuration: selectedSettingsConfiguration().configuration,
        }" />
    </app-configuration-section>
</div>

<div class="visual">
    <div
        class="component"
        [style.gap.px]="8"
    >
        <ng-container *ngTemplateOutlet="toastButton; context: { type: 'Success', configuration: toastService.configuration().success, localConfiguration: success() }" />
        <ng-container *ngTemplateOutlet="toastButton; context: { type: 'Warning', configuration: toastService.configuration().warning, localConfiguration: warning() }" />
        <ng-container *ngTemplateOutlet="toastButton; context: { type: 'Error', configuration: toastService.configuration().error, localConfiguration: error() }" />
        <ng-container *ngTemplateOutlet="toastButton; context: { type: 'Info', configuration: toastService.configuration().info, localConfiguration: info() }" />
    </div>

    <div class="log">
        Last toast time: {{ lastInteractionTime() }}<br/>
        <app-input-button
            label="Copy configuration"
            [width]="'25%'"
            [style.margin-top.px]="10"
            (onClick)="copyToastConfiguration()"
        />
        <pre #code>const configuration: MvLibToastServiceConfiguration = {{ toastService.configuration() | json }};</pre>
</div>
