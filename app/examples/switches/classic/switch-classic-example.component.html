<div class="configuration">
    <app-configuration-section title="Styles">
        <app-inputs-separator title="Track" />
        <div class="inputs-group">
            Width
            <app-input-text
                [value]="switch().computedStyles().track!.width"
                (onChange)="
                    switch().setStyle('track.width', $event);
                    refreshLog();"
            />
            Height
            <app-input-text
                [value]="switch().computedStyles().track!.height"
                (onChange)="
                    switch().setStyle('track.height', $event);
                    refreshLog();"
            />
        </div>
        <div class="inputs-group">
            Color on
            <app-input-color
                [value]="switch().computedStyles().track!.colorOn"
                (onChange)="
                    switch().setStyle('track.colorOn', $event);
                    refreshLog();"
            />
            Color off
            <app-input-color
                [value]="switch().computedStyles().track!.colorOff"
                (onChange)="
                    switch().setStyle('track.colorOff', $event);
                    refreshLog();"
            />
        </div>
        <app-inputs-separator title="Cursor" />
        <div class="inputs-group">
            Color on
            <app-input-color
                [value]="switch().computedStyles().cursor!.colorOn"
                (onChange)="
                    switch().setStyle('cursor.colorOn', $event);
                    refreshLog();"
            />
            Color off
            <app-input-color
                [value]="switch().computedStyles().cursor!.colorOff"
                (onChange)="
                    switch().setStyle('cursor.colorOff', $event);
                    refreshLog();"
            />
        </div>
        <div class="inputs-group">
            Icon on
            <app-input-text
                [value]="switch().computedStyles().cursor!.iconOn"
                (onChange)="
                    switch().setStyle('cursor.iconOn', $event);
                    refreshLog();"
            />
            Icon off
            <app-input-text
                [value]="switch().computedStyles().cursor!.iconOff"
                (onChange)="
                    switch().setStyle('cursor.iconOff', $event);
                    refreshLog();"
            />
        </div>
        <div class="inputs-group">
            Icon color on
            <app-input-color
                [value]="switch().computedStyles().cursor!.iconColorOn"
                (onChange)="
                    switch().setStyle('cursor.iconColorOn', $event);
                    refreshLog();"
            />
            Icon color off
            <app-input-color
                [value]="switch().computedStyles().cursor!.iconColorOff"
                (onChange)="
                    switch().setStyle('cursor.iconColorOff', $event);
                    refreshLog();"
            />
        </div>
    </app-configuration-section>

    <app-configuration-section title="Effects">
        <app-shadow-idle-inputs
            title="Track shadow idle"
            [enabled]="switch().hasEffectClass(mvLibEffects.idle.shadow.class)"
            [style]="switch().computedEffects().parts.track!.styles!.shadowIdle!"
            (onChangeEnabled)="
                switch().setEffect(`track.${mvLibEffects.idle.shadow.class}`, $event);
                refreshLog();"
            (onChangeStyle)="
                switch().setEffectStyle(`track.${mvLibEffects.idle.shadow.name}`, $event);
                refreshLog();"
        />
        <app-resize-hover-inputs
            title="Cursor resize hover"
            [enabled]="switch().hasEffectClass(mvLibEffects.hover.resize.class)"
            [style]="switch().computedEffects().parts.cursor!.styles!.resizeHover!"
            (onChangeEnabled)="
                switch().setEffect(`cursor.${mvLibEffects.hover.resize.class}`, $event);
                refreshLog();"
            (onChangeStyle)="
                switch().setEffectStyle(`cursor.${mvLibEffects.hover.resize.name}`, $event);
                refreshLog();"
        />
    </app-configuration-section>

    <app-configuration-section title="Settings">
        <app-input-checkbox
            [checked]="disabled()"
            label="Disabled"
            (onChange)="
                disabled.set($event);
                refreshLog();
            "
        />
        <app-input-text
            label="Transition duration"
            [value]="switch().computedSettings().transitionDuration"
            (onChange)="
                switch().setSettings('transitionDuration', $event);
                refreshLog();"
        />
        <app-inputs-separator title="API" />
        <app-input-checkbox
            [checked]="active()"
            label="Activated"
            (onChange)="
                switch().setActive($event);
                active.set($event);
                refreshLog();
            "
        />
    </app-configuration-section>
</div>

<div class="visual">
    <mv-lib-switch-classic
        #mvLibSwitchClassic
        class="component"
        [styles]="style()"
        [effects]="effects()"
        [settings]="settings()"
        [disabled]="disabled()"
        [active]="active()"
        (onToggle)="
            active.set($event.active);
            refreshLastInteractionTime();
            refreshLog();
        "
    />

<pre class="log">
Last interaction time: {{ lastInteractionTime() }}<br/>
&lt;mv-lib-switch-classic{{ log() }}/&gt;
</pre>
</div>
