<div class="view">
    <div class="configuration">
        <app-configuration-section title="Styles">
            <app-inputs-separator label="Background color"/>
            <div class="inputs-group">
                Default
                <app-input-color
                    [value]="_button().api.style.backgroundColor.getForState('idle')"
                    (onChange)="_button().api.style.backgroundColor.setForState('idle', $event); refreshLog();"
                />
                Selected
                <app-input-color
                    [value]="_button().api.style.backgroundColor.getForState('selected')"
                    (onChange)="_button().api.style.backgroundColor.setForState('selected', $event); refreshLog();"
                />
            </div>
            <app-dimensions-inputs
                [value]="_button().api.style.getDimensions()"
                (onChange)="_button().api.style.setDimensions($event.key, $event.value); refreshLog();"
            />
            <app-outline-inputs
                [states]="buttonStates"
                [(state)]="outlineState"
                [value]="_button().api.style.outline.getForState(outlineState())"
                (onChange)="_button().api.style.outline.setForState($event.state ?? 'idle', $event.key, $event.value); refreshLog();"
            />
            <app-font-inputs
                [states]="buttonStates"
                [(state)]="fontState"
                [value]="_button().api.style.font.getForState(fontState())"
                (onChange)="_button().api.style.font.setForState($event.state ?? 'idle', $event.key, $event.value); refreshLog();"
            />
        </app-configuration-section>

        <app-configuration-section title="Effects">
            <app-shadow-effect-inputs
                title="Shadow idle"
                [enabled]="_button().api.effects.has(mvLibEffects.idle.shadow)"
                [style]="_button().api.effects.getStyle(mvLibEffects.idle.shadow)"
                (onChangeEnabled)="_button().api.effects.toggle(mvLibEffects.idle.shadow, $event); refreshLog();"
                (onChangeStyle)="_button().api.effects.setStyle(mvLibEffects.idle.shadow, $event); refreshLog();"
            />
            <app-tint-effect-inputs
                title="Tint hover"
                [enabled]="_button().api.effects.has(mvLibEffects.hover.tint)"
                [style]="_button().api.effects.getStyle(mvLibEffects.hover.tint)"
                (onChangeEnabled)="_button().api.effects.toggle(mvLibEffects.hover.tint, $event); refreshLog();"
                (onChangeStyle)="_button().api.effects.setStyle(mvLibEffects.hover.tint, $event); refreshLog();"
            />
            <app-push-click-inputs
                title="Push click"
                [enabled]="_button().api.effects.has(mvLibEffects.click.push)"
                [style]="_button().api.effects.getStyle(mvLibEffects.click.push)"
                (onChangeEnabled)="_button().api.effects.toggle(mvLibEffects.click.push, $event); refreshLog();"
                (onChangeStyle)="_button().api.effects.setStyle(mvLibEffects.click.push, $event); refreshLog();"
            />
            <app-ripple-release-inputs
                title="Ripple release"
                [enabled]="_button().api.effects.has(mvLibEffects.release.ripple)"
                [style]="_button().api.effects.getStyle(mvLibEffects.release.ripple)"
                (onChangeEnabled)="_button().api.effects.toggle(mvLibEffects.release.ripple, $event); refreshLog();"
                (onChangeStyle)="_button().api.effects.setStyle(mvLibEffects.release.ripple, $event); refreshLog();"
            />
        </app-configuration-section>

        <app-configuration-section title="Settings">
            <app-input-checkbox
                [checked]="disabled()"
                label="Disabled"
                (onChange)="disabled.set($event); refreshLog();"
            />
        </app-configuration-section>
    </div>

    <div class="render">
        <mv-lib-button
            #button
            class="component"
            [inputStyle]="style()"
            [inputEffects]="effects()"
            [inputSettings]="settings()"
            [disabled]="disabled()"
            [(selected)]="selected"
            (onClick)="
                selected.set(!selected());
                refreshLastInteractionTime()"
        >
            <span class="material-symbols-outlined">
                touch_app
            </span>
            Click
        </mv-lib-button>

        <div class="log">
            Last interaction time: {{ lastInteractionTime() }}
            <app-input-button
                label="Copy component code"
                [width]="'25%'"
                [style.margin-top.px]="10"
                (onClick)="copyComponentCode()"
            />
            <pre #code>&lt;mv-lib-button-classic{{ log() }}&gt;<br/>    MV Lib button classic<br/>&lt;/mv-lib-button-classic&gt;</pre>
        </div>
    </div>
</div>
