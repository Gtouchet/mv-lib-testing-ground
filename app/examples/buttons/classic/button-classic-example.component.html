<div class="configuration">
    
    <app-configuration-section title="Styles">
        @if (styleInitialized()) {
            <app-input-color
                [value]="styles().backgroundColor"
                label="Background color"
                (onChange)="setStyle('backgroundColor', $event)"
            />
            <app-dimensions-inputs [component]="this" />
            <app-font-inputs [component]="this" />
        }
    </app-configuration-section>

    <app-configuration-section title="Effects">
        @if (effectsInitialized()) {
            <app-shadow-idle-inputs [component]="this" />
            <app-darken-hover-inputs [component]="this" />
            <app-push-click-inputs [component]="this" />
            <app-ripple-release-inputs [component]="this" />
        }
    </app-configuration-section>

    <app-configuration-section title="Settings">
        @if (settingsInitialized()) {
            <app-input-checkbox
                [checked]="disabled()"
                label="Disabled"
                (onChange)="
                    disabled.set($event);
                    refreshLog();
                "
            />
        }
    </app-configuration-section>
</div>

<div class="visual">
    <mv-lib-button-classic
        #mvLibComponent
        class="component"
        [styles]="styles()"
        [effects]="effects()"
        [settings]="settings()"
        [disabled]="disabled()"
        (onClick)="refreshLastInteractionTime()"
    >
        <div
            [style.display]="'flex'"
            [style.align-items]="'center'"
        >
        </div>
        <span class="material-symbols-outlined">
            touch_app
        </span>
        Click
    </mv-lib-button-classic>

<pre class="log">
Last interaction time: {{ lastInteractionTime() }}<br/>
&lt;mv-lib-button-classic{{ log() }}/&gt;
</pre>
</div>
