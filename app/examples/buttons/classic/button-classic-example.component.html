<div class="configuration">
    <app-configuration-section title="Styles">
        <app-inputs-separator title="General" />
        <app-input-color
            label="Background color"
            [value]="button().getStyle().backgroundColor"
            (onChange)="button().setStyle('backgroundColor', $event); refreshLog();"
        />
        <app-dimensions-inputs
            [dimensions]="button().getStyle().dimensions"
            (onChangeDimensions)="button().setStyle(`dimensions.${$event.key}`, $event.value); refreshLog();"
        />
        <app-border-inputs
            [border]="button().getStyle().border"
            (onChangeBorder)="button().setStyle(`border.${$event.key}`, $event.value); refreshLog();"
        />
        <app-font-inputs
            [font]="button().getStyle().font"
            (onChangeFont)="button().setStyle(`font.${$event.key}`, $event.value); refreshLog();"
        />
    </app-configuration-section>

    <app-configuration-section title="Effects">
        <app-shadow-idle-inputs
            [enabled]="button().hasEffect(mvLibEffects.idle.shadow)"
            [style]="button().getEffects().styles.shadowIdle!"
            (onChangeEnabled)="button().toggleEffect(mvLibEffects.idle.shadow, $event); refreshLog();"
            (onChangeStyle)="button().setEffectStyle(mvLibEffects.idle.shadow, $event); refreshLog();"
        />
        <app-tint-hover-inputs
            [enabled]="button().hasEffect(mvLibEffects.hover.tint)"
            [style]="button().getEffects().styles.tintHover!"
            (onChangeEnabled)="button().toggleEffect(mvLibEffects.hover.tint, $event); refreshLog();"
            (onChangeStyle)="button().setEffectStyle(mvLibEffects.hover.tint, $event); refreshLog();"
        />
        <app-push-click-inputs
            [enabled]="button().hasEffect(mvLibEffects.click.push)"
            [style]="button().getEffects().styles.pushClick!"
            (onChangeEnabled)="button().toggleEffect(mvLibEffects.click.push, $event); refreshLog();"
            (onChangeStyle)="button().setEffectStyle(mvLibEffects.click.push, $event); refreshLog();"
        />
        <app-ripple-release-inputs
            [enabled]="button().hasEffect(mvLibEffects.release.ripple)"
            [style]="button().getEffects().styles.rippleRelease!"
            (onChangeEnabled)="button().toggleEffect(mvLibEffects.release.ripple, $event); refreshLog();"
            (onChangeStyle)="button().setEffectStyle(mvLibEffects.release.ripple, $event); refreshLog();"
        />
    </app-configuration-section>

    <app-configuration-section title="Settings">
        <app-input-checkbox
            [checked]="disabled()"
            label="Disabled"
            (onChange)="disabled.set($event); refreshLog();"
        />
    </app-configuration-section>
</div>

<div class="visual">
    <mv-lib-button-classic
        #mvLibButtonClassic
        class="component"
        [style]="style()"
        [effects]="effects()"
        [settings]="settings()"
        [disabled]="disabled()"
        (onClick)="refreshLastInteractionTime()"
    >
        <span class="material-symbols-outlined">
            touch_app
        </span>
        Click
    </mv-lib-button-classic>

    <div class="log">
        Last interaction time: {{ lastInteractionTime() }}
        <app-input-button
            label="Copy component code"
            [width]="'25%'"
            [style.margin-top.px]="10"
            (onClick)="copyComponentCode('mv-lib-button-classic')"
        />
        <pre>&lt;mv-lib-button-classic{{ log() }}/&gt;</pre>
    </div>
</div>
