<div class="configuration">
    <app-configuration-section title="Styles">
        <app-inputs-separator title="General" />
        <app-input-color
            label="Background color"
            [value]="button().computedStyles().backgroundColor"
            (onChange)="
                button().setStyle('backgroundColor', $event);
                refreshLog();"
        />
        <app-dimensions-inputs
            [dimensions]="button().computedStyles().dimensions"
            (onChangeDimensions)="
                button().setStyle(`dimensions.${$event.key}`, $event.value);
                refreshLog();"
        />
        <app-font-inputs
            [font]="button().computedStyles().font"
            (onChangeFont)="
                button().setStyle(`font.${$event.key}`, $event.value);
                refreshLog();"
        />
    </app-configuration-section>

    <app-configuration-section title="Effects">
        <app-shadow-idle-inputs
            [enabled]="button().hasEffectClass(mvLibEffects.idle.shadow.class)"
            [style]="button().computedEffects().styles.shadowIdle"
            (onChangeEnabled)="button().setEffect(mvLibEffects.idle.shadow.class, $event)"
            (onChangeStyle)="
                button().setEffectStyle(mvLibEffects.idle.shadow.name, $event);
                refreshLog();"
        />
        <app-tint-hover-inputs
            [enabled]="button().hasEffectClass(mvLibEffects.hover.tint.class)"
            [style]="button().computedEffects().styles.tintHover"
            (onChangeEnabled)="button().setEffect(mvLibEffects.hover.tint.class, $event)"
            (onChangeStyle)="
                button().setEffectStyle(mvLibEffects.hover.tint.name, $event);
                refreshLog();"
        />
        <app-push-click-inputs
            [enabled]="button().hasEffectClass(mvLibEffects.click.push.class)"
            [style]="button().computedEffects().styles.pushClick"
            (onChangeEnabled)="button().setEffect(mvLibEffects.click.push.class, $event)"
            (onChangeStyle)="
                button().setEffectStyle(mvLibEffects.click.push.name, $event);
                refreshLog();"
        />
        <app-ripple-release-inputs
            [enabled]="button().hasEffectClass(mvLibEffects.release.ripple.class)"
            [style]="button().computedEffects().styles.rippleRelease"
            (onChangeEnabled)="button().setEffect(mvLibEffects.release.ripple.class, $event)"
            (onChangeStyle)="
                button().setEffectStyle(mvLibEffects.release.ripple.name, $event);
                refreshLog();"
        />
    </app-configuration-section>

    <app-configuration-section title="Settings">
        <app-input-checkbox
            [checked]="disabled()"
            label="Disabled"
            (onChange)="
                disabled.set($event);
                refreshLog();
            "
        />
    </app-configuration-section>
</div>

<div class="visual">
    <mv-lib-button-classic
        #mvLibButtonClassic
        class="component"
        [styles]="style()"
        [effects]="effects()"
        [settings]="settings()"
        [disabled]="disabled()"
        (onClick)="refreshLastInteractionTime()"
    >
        <div
            [style.display]="'flex'"
            [style.align-items]="'center'"
        >
        </div>
        <span class="material-symbols-outlined">
            touch_app
        </span>
        Click
    </mv-lib-button-classic>

<pre class="log">
Last interaction time: {{ lastInteractionTime() }}<br/>
&lt;mv-lib-button-classic{{ log() }}/&gt;
</pre>
</div>
