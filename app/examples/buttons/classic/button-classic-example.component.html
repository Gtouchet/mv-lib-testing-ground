<div class="configuration">
    
    <app-configuration-section title="Styles">
        <app-input-color
            [value]="styles().backgroundColor"
            label="Background color"
            (onChange)="setStyle('backgroundColor', $event)"
        />

        <!-- <app-dimensions-inputs
            [width]="styles().widthPx"
            [heightPx]="styles().heightPx"
            (onChange)="updateDimensions($event)"
        />
        <app-input-number
            [value]="styles().widthPx"
            label="Width px"
            (onChange)="updateStyle('widthPx', $event)"
        />
        <app-input-number
            [value]="styles().heightPx"
            label="Height px"
            (onChange)="updateStyle('heightPx', $event)"
        />

        <app-input-color
            [value]="styles().textColor"
            label="Text color"
            (onChange)="updateStyle('textColor', $event)"
        /> -->
    </app-configuration-section>

    <app-configuration-section title="Effects">
        <b>
            Idle
        </b>
        <app-input-checkbox
            
            label="Shadow"
            (onChange)="setEffect('shadow', $event)"
        />
        <b>
            Hover
        </b>
        <app-input-checkbox
            
            label="Darken"
            (onChange)="setEffect('mv-lib-darken-hover', $event)"
        />
        <b>
            Click
        </b>
        <app-input-checkbox
        
            label="Push"
            (onChange)="setEffect('push', $event)"
        />
        <app-input-checkbox
            
            label="Ripple"
            (onChange)="setEffect('ripple', $event)"
        />
    </app-configuration-section>

    <app-configuration-section title="Settings">
        <app-input-checkbox
            [checked]="disabled()"
            label="Disabled"
            (onChange)="
                disabled.set($event);
                refreshLog();
            "
        />
    </app-configuration-section>
</div>

<div class="visual">
    <mv-lib-button-classic
        #mvLibComponent
        class="component"
        [styles]="styles()"
        [effects]="effects()"
        [settings]="settings()"
        [disabled]="disabled()"
        (onClick)="refreshLastInteractionTime()"
    >
        <div
            [style.display]="'flex'"
            [style.align-items]="'center'"
        >
        </div>
        <span class="material-symbols-outlined">
            touch_app
        </span>
        <span [style.font-weight]="'bold'">
            Click
        </span>
    </mv-lib-button-classic>

<pre class="log">
Last interaction time: {{ lastInteractionTime() }}<br/>
{{ log() }}
</pre>
</div>
