<div
    [ngStyle]="{
        'display': 'flex',
        'align-items': 'center',
        'gap.px': 8,
        'margin-bottom.px': 4,
    }"
>
    <b>
        Border
    </b>
    <hr
        [ngStyle]="{
            'flex': '1',
            'margin': '0',
            'margin-right.px': 6,
        }"
    />
</div>
<div
    [ngStyle]="{
        'display': 'grid',
        'grid-template-columns': 'max-content 1fr',
        'column-gap.px': 8,
        'row-gap.px': 4,
        'align-items': 'center',
    }"
>
    Width
    <app-input-text
        [value]="width()"
        (onChange)="onWidthChange.emit($event)"
    />
    Style
    <div
        [ngStyle]="{
            'display': 'flex',
            'gap.px': 4,
        }"
    >
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[0]]"
            (onChange)="
                borderStyles()[0] = $event;
                onStyleChange.emit(borderStyles().join(' '));
            "
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[1]]"
            (onChange)="
                borderStyles()[1] = $event;
                onStyleChange.emit(borderStyles().join(' '));
            "
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[2]]"
            (onChange)="
                borderStyles()[2] = $event;
                onStyleChange.emit(borderStyles().join(' '));
            "
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[3]]"
            (onChange)="
                borderStyles()[3] = $event;
                onStyleChange.emit(borderStyles().join(' '));
            "
        />
    </div>
    Color
    <app-input-color
        [value]="color()"
        (onChange)="onColorChange.emit($event)"
    />
    Radius
    <app-input-text
        [value]="radius()"
        (onChange)="onRadiusChange.emit($event)"
    />
</div>
