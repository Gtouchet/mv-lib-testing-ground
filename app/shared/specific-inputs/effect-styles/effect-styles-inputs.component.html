<div
    [ngStyle]="{
        'display': 'flex',
        'align-items': 'center',
        'gap.px': 8,
        'margin-bottom.px': 4,
    }"
>
    <b>
        Effects styles
    </b>
    <hr
        [ngStyle]="{
            'flex': '1',
            'margin': '0',
            'margin-right.px': 6,
        }"
    />
</div>
<div
    [ngStyle]="{
        'display': 'grid',
        'grid-template-columns': 'max-content 1fr',
        'column-gap.px': 8,
        'row-gap.px': 4,
        'align-items': 'center',
    }"
>
    <ng-content/>
</div>
