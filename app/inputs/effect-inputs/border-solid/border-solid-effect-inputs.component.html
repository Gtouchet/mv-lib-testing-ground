<div class="effect">
    <app-inputs-separator [title]="title() ?? 'Border solid'">
        <app-input-checkbox
            [checked]="enabled()"
            (onChange)="onChangeEnabled.emit($event)"
        />
    </app-inputs-separator>
</div>
<div class="inputs-group">
    Color
    <app-input-color
        [value]="style().color"
        (onChange)="onChangeStyle.emit({key: 'color', value: $event})"
    />
    Width
    <app-input-text
        [value]="style().width"
        (onChange)="onChangeStyle.emit({key: 'width', value: $event})"
    />
    Style
    <app-input-text
        [value]="style().style"
        (onChange)="onChangeStyle.emit({key: 'style', value: $event})"
    />
</div>
