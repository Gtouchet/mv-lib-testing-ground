<div class="effect">
    <app-inputs-separator [title]="title() ?? 'Outline blur'">
        <app-input-checkbox
            [checked]="enabled()"
            (onChange)="onChangeEnabled.emit($event)"
        />
    </app-inputs-separator>
</div>
<div class="inputs-group">
    Radius
    <app-input-text
        [value]="style().radius"
        (onChange)="onChangeStyle.emit({key: 'radius', value: $event})"
    />
    Color
    <app-input-color
        [value]="style().color"
        (onChange)="onChangeStyle.emit({key: 'color', value: $event})"
    />
    Offset
    <app-input-text
        [value]="style().offset"
        (onChange)="onChangeStyle.emit({key: 'offset', value: $event})"
    />
</div>
