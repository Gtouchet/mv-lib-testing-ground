<div class="effect">
    <app-inputs-separator [title]="title() ?? 'Fade in idle'">
        <app-input-checkbox
            [checked]="enabled()"
            (onChange)="onChangeEnabled.emit($event)"
        />
    </app-inputs-separator>
</div>
<div class="inputs-group">
    Duration
    <app-input-text
        [value]="style().duration"
        (onChange)="onChangeStyle.emit({key: 'duration', value: $event})"
    />
    Starting delay
    <app-input-text
        [value]="style().startingDelay"
        (onChange)="onChangeStyle.emit({key: 'startingDelay', value: $event})"
    />
</div>
