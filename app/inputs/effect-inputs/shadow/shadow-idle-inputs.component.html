<div class="effect">
    <app-input-checkbox
        [checked]="$any(component().effects()).classes.includes(component().mvLibEffects.idle.shadow)"
        (onChange)="component().setEffect(component().mvLibEffects.idle.shadow, $event)"
    />
    <app-inputs-separator title="Shadow idle" />
</div>
<div class="inputs-group">
    Pos. X
    <app-input-text
        [value]="$any(component().effects()).styles.shadowIdle.x"
        (onChange)="component().setEffectStyle('shadowIdle.x', $event)"
    />
    Pos. Y
    <app-input-text
        [value]="$any(component().effects()).styles.shadowIdle.y"
        (onChange)="component().setEffectStyle('shadowIdle.y', $event)"
    />
    Blur
    <app-input-text
        [value]="$any(component().effects()).styles.shadowIdle.blur"
        (onChange)="component().setEffectStyle('shadowIdle.blur', $event)"
    />
    Spread
    <app-input-text
        [value]="$any(component().effects()).styles.shadowIdle.spread"
        (onChange)="component().setEffectStyle('shadowIdle.spread', $event)"

    />
    Color
    <app-input-color
        [value]="$any(component().effects()).styles.shadowIdle.color"
        (onChange)="component().setEffectStyle('shadowIdle.color', $event)"
    />
</div>
