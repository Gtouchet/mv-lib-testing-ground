<div class="effect">
    <app-inputs-separator [title]="title() ?? 'Outline solid'">
        <app-input-checkbox
            [checked]="enabled()"
            (onChange)="onChangeEnabled.emit($event)"
        />
    </app-inputs-separator>    
</div>
<div class="inputs-group">
    Width
    <app-input-text
        [value]="style().width"
        (onChange)="onChangeStyle.emit({key: 'width', value: $event})"
    />
    Color
    <app-input-color
        [value]="style().color"
        (onChange)="onChangeStyle.emit({key: 'color', value: $event})"
    />
    Offset
    <app-input-text
        [value]="style().offset"
        (onChange)="onChangeStyle.emit({key: 'offset', value: $event})"
    />
</div>
