<div class="effect">
    <app-input-checkbox
        [checked]="checked()"
        (onChange)="onChangeChecked($event)"
    />
    <app-inputs-separator [title]="title() ?? 'Darken hover'" />
</div>
<div class="inputs-group">
    Effect %
    <app-input-number
        [value]="effectPercentage()"
        (onChange)="onChangeEffectPercentage($event)"
    />
</div>
