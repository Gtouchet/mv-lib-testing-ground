<div class="effect">
    <app-input-checkbox
        [checked]="checked()"
        (onChange)="onChangeChecked($event)"
    />
    <app-inputs-separator [title]="title() ?? 'Ripple release'" />
</div>
<div class="inputs-group">
    Origin x
    <app-input-text
        [value]="originX()"
        (onChange)="onChangeOriginX($event)"
    />
    Origin y
    <app-input-text
        [value]="originY()"
        (onChange)="onChangeOriginY($event)"
    />
    Size
    <app-input-text
        [value]="size()"
        (onChange)="onChangeSize($event)"
    />
    Delay
    <app-input-text
        [value]="delay()"
        (onChange)="onChangeDelay($event)"
    />
</div>
