<div class="effect">
    <app-inputs-separator [title]="title() ?? 'Ripple release'">
        <app-input-checkbox
            [checked]="enabled()"
            (onChange)="onChangeEnabled.emit($event)"
        />
    </app-inputs-separator>
</div>
<div class="inputs-group">
    Origin
    <app-input-radio
        [values]="['mouse', 'component']"
        [selected]="style().origin"
        (onChange)="onChangeStyle.emit({key: 'origin', value: $event})"
    />
    Origin X
    <app-input-text
        [value]="style().originX"
        [disabled]="style().origin === 'mouse'"
        (onChange)="onChangeStyle.emit({key: 'originX', value: $event})"
    />
    Origin Y
    <app-input-text
        [value]="style().originY"
        [disabled]="style().origin === 'mouse'"
        (onChange)="onChangeStyle.emit({key: 'originY', value: $event})"
    />
    Size
    <app-input-text
        [value]="style().size"
        (onChange)="onChangeStyle.emit({key: 'size', value: $event})"
    />
    Delay
    <app-input-text
        [value]="style().delay"
        (onChange)="onChangeStyle.emit({key: 'delay', value: $event})"
    />
</div>
