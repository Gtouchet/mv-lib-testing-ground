<div class="effect">
    <app-input-checkbox
        [checked]="enabled()"
        (onChange)="onEnabledChange.emit($event)"
    />
    <app-inputs-separator label="Outline blur selected" />
</div>
<div class="inputs-group">
    Color
    <app-input-color
        [value]="color()"
        (onChange)="onColorChange.emit($event)"
    />
    Width
    <app-input-text
        [value]="radius()"
        (onChange)="onRadiusChange.emit($event)"
    />
</div>
