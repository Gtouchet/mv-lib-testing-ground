<app-inputs-separator [label]="label() ?? 'Outline'">
    @if (states().length) {
        <app-input-select
            separatorEnd
            [values]="$any(states())"
            [selectedValues]="[state()]"
            (onChange)="selectState($event)"
        />
    }
</app-inputs-separator>
<div class="inputs-group">
    Width
    <app-input-text
        [value]="value().width"
        (onChange)="emitChange('width', $event)"
    />
    Style
    <app-input-select
        [values]="cssOutlineStyles"
        [selectedValues]="[value().style]"
        (onChange)="emitChange('style', $event)"
    />
    Color
    <app-input-color
        [value]="value().color"
        (onChange)="emitChange('color', $event)"
    />
    Radius
    <app-input-text
        [value]="value().radius"
        (onChange)="emitChange('radius', $event)"
    />
    Offset
    <app-input-text
        [value]="value().offset"
        (onChange)="emitChange('offset', $event)"
    />
</div>
