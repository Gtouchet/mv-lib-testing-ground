<app-inputs-separator [label]="label() ?? 'Outline'" />
<div class="inputs-group">
    Width
    <app-input-text
        [value]="value().width"
        (onChange)="onChange.emit({key: 'width', value: $event})"
    />
    Style
    <app-input-select
        [values]="cssOutlineStyles"
        [selectedValues]="[value().style]"
        (onChange)="onChange.emit({key: 'style', value: $event})"
    />
    Color
    <app-input-color
        [value]="value().color"
        (onChange)="onChange.emit({key: 'color', value: $event})"
    />
    Radius
    <app-input-text
        [value]="value().radius"
        (onChange)="onChange.emit({key: 'radius', value: $event})"
    />
    Offset
    <app-input-text
        [value]="value().offset"
        (onChange)="onChange.emit({key: 'offset', value: $event})"
    />
</div>
