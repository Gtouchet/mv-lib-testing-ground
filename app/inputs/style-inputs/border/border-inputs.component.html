<app-inputs-separator [title]="title() ?? 'Border'" />
<div class="inputs-group">
    Width
    <app-input-text
        [value]="border().width"
        (onChange)="onChangeBorder.emit({key: 'width', value: $event})"
    />
    Style
    <div class="inputs-row">
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyle()[0]]"
            (onChange)="updateBorderStyle(0, $event)"
            [style.flex]="1"
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyle()[1]]"
            (onChange)="updateBorderStyle(1, $event)"
            [style.flex]="1"
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyle()[2]]"
            (onChange)="updateBorderStyle(2, $event)"
            [style.flex]="1"
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyle()[3]]"
            (onChange)="updateBorderStyle(3, $event)"
            [style.flex]="1"
        />
    </div>
    Color
    <app-input-color
        [value]="border().color"
        (onChange)="onChangeBorder.emit({key: 'color', value: $event})"
    />
    Radius
    <app-input-text
        [value]="border().radius"
        (onChange)="onChangeBorder.emit({key: 'radius', value: $event})"
    />
</div>
