<app-inputs-separator [label]="label() ?? 'Font'">
    @if (states().length) {
        <app-input-select
            separatorEnd
            [values]="$any(states())"
            [selectedValues]="[state()]"
            (onChange)="selectState($event)"
        />
    }
</app-inputs-separator>
<div class="inputs-group">
    Size
    <div class="inputs-row">
        <app-input-select
            [values]="cssFontSizes"
            [selectedValues]="[value().size]"
            [width]="100"
            (onChange)="emitChange('size', $event)"
        />
        <app-input-text
            [value]="value().size"
            (onChange)="emitChange('size', $event)"
            [style.flex]="1"
        />
    </div>
    Weight
    <div class="inputs-row">
        <app-input-select
            [values]="cssFontWeights"
            [selectedValues]="[value().weight]"
            [width]="100"
            (onChange)="emitChange('weight', $event)"
        />
        <app-input-text
            [value]="value().weight"
            (onChange)="emitChange('weight', $event)"
            [style.flex]="1"
        />
    </div>
    Style
    <div class="inputs-row">
        <app-input-select
            [values]="cssFontStyles"
            [selectedValues]="[value().style]"
            [width]="100"
            (onChange)="emitChange('style', $event)"
        />
        <app-input-text
            [value]="value().style"
            (onChange)="emitChange('style', $event)"
            [style.flex]="1"
        />
    </div>
    Color
    <app-input-color
        [value]="value().color"
        [width]="100"
        (onChange)="emitChange('color', $event)"
    />
</div>
