<app-inputs-separator [title]="title() ?? 'Font'" />
<div class="inputs-group">
    Size
    <div class="inputs-row">
        <app-input-select
            [values]="cssFontSizes"
            [selectedValues]="[$any(component().styles())[fontPropertyName()].size]"
            [width]="100"
            (onChange)="component().setStyle(fontPropertyName() + '.size', $event)"
        />
        <app-input-text
            [value]="$any(component().styles())[fontPropertyName()].size"
            (onChange)="component().setStyle(fontPropertyName() + '.size', $event)"
            [style.flex]="1"
        />
    </div>
    Weight
    <div class="inputs-row">
        <app-input-select
            [values]="cssFontWeights"
            [selectedValues]="[$any(component().styles())[fontPropertyName()].weight]"
            [width]="100"
            (onChange)="component().setStyle(fontPropertyName() + '.weight', $event)"
        />
        <app-input-text
            [value]="$any(component().styles())[fontPropertyName()].weight"
            (onChange)="component().setStyle(fontPropertyName() + '.weight', $event)"
            [style.flex]="1"
        />
    </div>
    Style
    <div class="inputs-row">
        <app-input-select
            [values]="cssFontStyles"
            [selectedValues]="[$any(component().styles())[fontPropertyName()].style]"
            [width]="100"
            (onChange)="component().setStyle(fontPropertyName() + '.style', $event)"
        />
        <app-input-text
            [value]="$any(component().styles())[fontPropertyName()].style"
            (onChange)="component().setStyle(fontPropertyName() + '.style', $event)"
            [style.flex]="1"
        />
    </div>
    Color
    <app-input-color
        [value]="$any(component().styles())[fontPropertyName()].color"
        [width]="100"
        (onChange)="component().setStyle(fontPropertyName() + '.color', $event)"
    />
</div>
