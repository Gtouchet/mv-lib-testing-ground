<app-inputs-separator title="Border" />
<div class="inputs-group">
    Width
    <app-input-text
        [value]="$any(component().styles()).border.width"
        (onChange)="component().setStyle('border.width', $event)"
    />
    Style
    <div class="inputs-row">
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[0]]"
            (onChange)="
                borderStyles()[0] = $event;
                component().setStyle('border.style', borderStyles().join(' '));
            "
            [style.flex]="1"
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[1]]"
            (onChange)="
                borderStyles()[1] = $event;
                component().setStyle('border.style', borderStyles().join(' '));
            "
            [style.flex]="1"
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[2]]"
            (onChange)="
                borderStyles()[2] = $event;
                component().setStyle('border.style', borderStyles().join(' '));
            "
            [style.flex]="1"
        />
        <app-input-select
            [values]="cssBorderStyles"
            [selectedValues]="[borderStyles()[3]]"
            (onChange)="
                borderStyles()[3] = $event;
                component().setStyle('border.style', borderStyles().join(' '));
            "
            [style.flex]="1"
        />
    </div>
    Color
    <app-input-color
        [value]="$any(component().styles()).border.color"
        (onChange)="component().setStyle('border.color', $event)"
    />
    Radius
    <app-input-text
        [value]="$any(component().styles()).border.radius"
        (onChange)="component().setStyle('border.radius', $event)"
    />
</div>
