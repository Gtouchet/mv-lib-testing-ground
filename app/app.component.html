<div class="app-shell">
    <header class="header">
        <div class="buttons">
            <mv-lib-button-classic
                [styles]="{
                    backgroundColor: 'dodgerblue',
                    dimensions: {
                        width: '110px',
                        height: '32px',
                    },
                    font: {
                        color: 'white',
                        weight: 'bold',
                        size: '16px',
                    },
                }"
                [effects]="{
                    classes: [
                        'mv-lib-shadow-idle',
                        'mv-lib-darken-hover',
                        'mv-lib-push-click',
                    ],
                }"
                (onClick)="router.navigateByUrl('/home')"
            >
                <span
                    class="material-symbols-outlined"
                    style="margin-right: 4px;"
                >
                    home
                </span>
                MV Lib
            </mv-lib-button-classic>

            @for (dropdown of dropdowns(); track dropdown.name) {
                <mv-lib-dropdown-classic
                    [items]="dropdown.items"
                    [selected]="dropdown.selected"
                    [styles]="dropdownsStyles"
                    [effects]="dropdownsEffects"
                    (onSelect)="onItemSelect($event.selectedItem!, dropdown.name)"
                >
                    <ng-template mvLibDropdownPlaceholderTemplate>
                        <div class="dropdown-placeholder">
                            <span class="material-symbols-outlined">
                                {{ dropdown.icon }}
                            </span>
                            <b>
                                {{ dropdown.name }}
                            </b>
                        </div>
                    </ng-template>
                    <ng-template mvLibDropdownSelectedTemplate let-item>
                        <div class="dropdown-selected">
                            <span class="material-symbols-outlined">
                                {{ dropdown.icon }}
                            </span>
                            {{ item.type + (item.wip ? ' (WIP)' : '') }}
                        </div>
                    </ng-template>
                    <ng-template mvLibDropdownItemTemplate let-item>
                        <div class="dropdown-item">
                            {{ item.type + (item.wip ? ' (WIP)' : '') }}
                        </div>
                    </ng-template>
                </mv-lib-dropdown-classic>
            }
        </div>
        <hr/>
    </header>

    <main class="app-content">
        <router-outlet />
    </main>
</div>

<mv-lib-toast-classic />
